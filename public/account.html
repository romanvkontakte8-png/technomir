<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой аккаунт — ТехноМир</title>
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('technomir_theme')||'dark');</script>
</head>
<body>

<header class="header">
  <div class="container header__inner">
    <a href="index.html" class="logo">
      <span class="logo__icon">TM</span>
      <span class="logo__text">ТехноМир</span>
    </a>
    <div class="search-bar">
      <input type="text" id="searchInput" class="search-bar__input" placeholder="Поиск товаров...">
      <button class="search-bar__btn" id="searchBtn">Найти</button>
    </div>
    <div class="header__actions">
      <a href="cart.html" class="header__cart" id="cartLink">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
        </svg>
        <span>Корзина</span>
        <span class="badge" id="cartBadge" style="display:none">0</span>
      </a>
      <a href="compare.html" class="header__compare" id="compareLink">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/>
        </svg>
        <span>Сравнение</span>
        <span class="badge" id="compareBadge">0</span>
      </a>
      <button class="theme-toggle" id="themeToggle" title="Сменить тему">☀️</button>
      <div class="header__auth" id="authBlock"><a href="login.html">Войти</a></div>
    </div>
  </div>
</header>

<main class="main">
  <div class="container">
    <h1 class="page-title">Личный кабинет</h1>

    <div class="account-grid">
      <!-- Профиль -->
      <div class="account-card">
        <h2>Профиль</h2>
        <div id="profileView"></div>
        <button class="btn btn--outline" id="editProfileBtn" style="margin-top:12px">Редактировать профиль</button>
        <div id="profileForm" style="display:none;margin-top:12px;">
          <div class="form-group">
            <label>Имя</label>
            <input type="text" id="profName" class="form-input">
          </div>
          <div class="form-group">
            <label>Телефон</label>
            <input type="text" id="profPhone" class="form-input" placeholder="+7 (999) 999-99-99">
          </div>
          <div class="form-group">
            <label>Новый пароль (оставьте пустым, если не менять)</label>
            <input type="password" id="profPassword" class="form-input" placeholder="Новый пароль">
          </div>
          <button class="btn btn--primary" id="saveProfileBtn">Сохранить</button>
          <button class="btn btn--outline" id="cancelProfileBtn">Отмена</button>
        </div>
      </div>

      <!-- Баланс -->
      <div class="account-card">
        <h2>Баланс</h2>
        <div class="balance-display" id="balanceDisplay">0 &#8381;</div>
        <div class="topup-section">
          <div class="topup-presets" id="topupPresets">
            <button class="topup-btn" data-amount="1000">1 000 &#8381;</button>
            <button class="topup-btn" data-amount="5000">5 000 &#8381;</button>
            <button class="topup-btn" data-amount="10000">10 000 &#8381;</button>
            <button class="topup-btn" data-amount="50000">50 000 &#8381;</button>
            <button class="topup-btn" data-amount="100000">100 000 &#8381;</button>
            <button class="topup-btn" data-amount="500000">500 000 &#8381;</button>
          </div>
          <div class="topup-custom">
            <input type="number" id="topupAmount" class="form-input" placeholder="Своя сумма" min="1">
            <button class="btn btn--primary" id="topupBtn">Пополнить</button>
          </div>
        </div>
      </div>
    </div>

    <h2 style="margin-top:32px;">Мои заказы</h2>
    <div class="loading" id="loading">Загрузка...</div>
    <div id="ordersEmpty" class="empty-state" style="display:none;">
      <p>У вас пока нет заказов</p>
      <a href="index.html" class="btn btn--primary">Перейти в каталог</a>
    </div>
    <div id="ordersList"></div>
  </div>
</main>

<footer class="footer">
  <div class="container footer__inner">
    <div class="footer__col">
      <h3>ТехноМир</h3>
      <p>Интернет-магазин электроники<br>г. Москва, ул. Профсоюзная, д. 56</p>
      <p class="footer__copy">Дипломный проект — Григорьев Я.М., СИП 433/22</p>
    </div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/account.js"></script>
</body>
</html>
