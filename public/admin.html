<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — ТехноМир</title>
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('technomir_theme')||'light');</script>
</head>
<body>

<header class="header">
  <div class="container header__inner">
    <a href="index.html" class="logo">
      <span class="logo__icon">TM</span>
      <span class="logo__text">ТехноМир</span>
    </a>
    <div class="header__actions">
      <a href="index.html" class="header__link">Главная</a>
      <a href="catalog.html" class="header__link">Каталог</a>
      <a href="cart.html" class="header__cart" id="cartLink">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
        </svg>
        <span>Корзина</span>
        <span class="badge" id="cartBadge" style="display:none">0</span>
      </a>
      <a href="compare.html" class="header__compare" id="compareLink">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/>
        </svg>
        <span>Сравнение</span>
        <span class="badge" id="compareBadge">0</span>
      </a>
      <button class="theme-toggle" id="themeToggle" title="Сменить тему"></button>
      <div class="header__auth" id="authBlock"><a href="login.html" class="header__login-btn">Войти</a></div>
    </div>
  </div>
</header>

<main class="main">
  <div class="container">
    <h1 class="page-title">Админ-панель</h1>

    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="orders">Заказы</button>
      <button class="admin-tab" data-tab="users">Клиенты</button>
    </div>

    <!-- Заказы -->
    <div class="admin-panel" id="ordersPanel">
      <div class="admin-filters">
        <label>Фильтр: </label>
        <select id="statusFilter">
          <option value="">Все</option>
          <option value="new">Новые</option>
          <option value="confirmed">Подтверждённые</option>
          <option value="delivered">Доставленные</option>
          <option value="cancelled">Отменённые</option>
        </select>
      </div>
      <div class="loading" id="ordersLoading">Загрузка...</div>
      <div id="adminOrdersList"></div>
    </div>

    <!-- Клиенты -->
    <div class="admin-panel" id="usersPanel" style="display:none;">
      <div class="loading" id="usersLoading">Загрузка...</div>
      <div id="adminUsersList"></div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container footer__inner">
    <div class="footer__col">
      <h3>ТехноМир</h3>
      <p>Интернет-магазин электроники<br>г. Москва, ул. Профсоюзная, д. 56</p>
      <p class="footer__copy">Дипломный проект — Григорьев Я.М., СИП 433/22</p>
    </div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
