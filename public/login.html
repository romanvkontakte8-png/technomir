<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — ТехноМир</title>
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('technomir_theme')||'light');</script>
</head>
<body>

<header class="header">
  <div class="container header__inner">
    <a href="index.html" class="logo">
      <span class="logo__icon">TM</span>
      <span class="logo__text">ТехноМир</span>
    </a>
    <div class="header__actions">
      <a href="index.html" class="header__link">Главная</a>
      <a href="catalog.html" class="header__link">Каталог</a>
      <a href="cart.html" class="header__cart" id="cartLink">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
        </svg>
        <span>Корзина</span>
        <span class="badge" id="cartBadge" style="display:none">0</span>
      </a>
      <button class="theme-toggle" id="themeToggle" title="Сменить тему"></button>
      <div class="header__auth" id="authBlock"><a href="login.html">Войти</a></div>
    </div>
  </div>
</header>

<main class="main">
  <div class="container">
    <div class="auth-form">
      <h1>Вход в аккаунт</h1>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Почта</label>
          <input type="email" id="email" required placeholder="Введите почту">
        </div>
        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" required placeholder="Введите пароль">
        </div>
        <div class="form-error" id="formError" style="display:none"></div>
        <button type="submit" class="btn btn--primary btn--full">Войти</button>
      </form>
      <p class="auth-form__link">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container footer__inner">
    <div class="footer__col">
      <h3>ТехноМир</h3>
      <p>Интернет-магазин электроники<br>г. Москва, ул. Профсоюзная, д. 56</p>
      <p class="footer__copy">Дипломный проект — Григорьев Я.М., СИП 433/22</p>
    </div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('formError');
  errEl.style.display = 'none';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error; errEl.style.display = 'block'; return; }

    Auth.login(data.token, data.user);
    window.location.href = data.user.role === 'admin' ? 'admin.html' : 'index.html';
  } catch (err) {
    errEl.textContent = 'Ошибка сервера'; errEl.style.display = 'block';
  }
});
</script>
</body>
</html>
