<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — ТехноМир</title>
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('technomir_theme')||'light');</script>
</head>
<body>

<header class="header">
  <div class="container header__inner">
    <a href="index.html" class="logo">
      <span class="logo__icon">TM</span>
      <span class="logo__text">ТехноМир</span>
    </a>
    <div class="header__actions">
      <button class="theme-toggle" id="themeToggle" title="Сменить тему">☀️</button>
      <div class="header__auth" id="authBlock"><a href="login.html">Войти</a></div>
    </div>
  </div>
</header>

<main class="main">
  <div class="container">
    <div class="auth-form">
      <h1>Регистрация</h1>
      <form id="registerForm">
        <div class="form-group">
          <label for="name">Имя *</label>
          <input type="text" id="name" required placeholder="Ваше имя">
        </div>
        <div class="form-group">
          <label for="email">Почта *</label>
          <input type="email" id="email" required placeholder="example@mail.ru">
        </div>
        <div class="form-group">
          <label for="phone">Телефон</label>
          <input type="tel" id="phone" placeholder="+7 (___) ___-__-__" pattern="\+7\s?\(?\d{3}\)?\s?\d{3}[\-\s]?\d{2}[\-\s]?\d{2}" title="Формат: +7 (999) 123-45-67">
        </div>
        <div class="form-group">
          <label for="password">Пароль *</label>
          <input type="password" id="password" required minlength="4" placeholder="Минимум 4 символа">
        </div>
        <div class="form-group">
          <label for="password2">Подтвердите пароль *</label>
          <input type="password" id="password2" required minlength="4" placeholder="Повторите пароль">
        </div>
        <div class="form-error" id="formError" style="display:none"></div>
        <button type="submit" class="btn btn--primary btn--full">Зарегистрироваться</button>
      </form>
      <p class="auth-form__link">Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container footer__inner">
    <div class="footer__col">
      <h3>ТехноМир</h3>
      <p>Интернет-магазин электроники<br>г. Москва, ул. Профсоюзная, д. 56</p>
      <p class="footer__copy">Дипломный проект — Григорьев Я.М., СИП 433/22</p>
    </div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('formError');
  errEl.style.display = 'none';

  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  if (password !== password2) {
    errEl.textContent = 'Пароли не совпадают';
    errEl.style.display = 'block';
    return;
  }

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value || undefined,
        password: password
      })
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error; errEl.style.display = 'block'; return; }

    Auth.login(data.token, data.user);
    window.location.href = 'index.html';
  } catch (err) {
    errEl.textContent = 'Ошибка сервера'; errEl.style.display = 'block';
  }
});
</script>
</body>
</html>
